<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Spike Tabata</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #111; color: #eee; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    button { font-size: 16px; padding: 12px; margin: 4px 0; width: 100%; border: 0; border-radius: 8px; background: #333; color: #fff; }
    button.primary { background: #2a7; }
    button.danger { background: #a33; }
    #phase { font-size: 22px; font-weight: bold; margin-top: 8px; }
    #time { font-size: 96px; font-variant-numeric: tabular-nums; text-align: center; line-height: 1.1; }
    #next, #total, #status { font-size: 14px; color: #bbb; }
    #log { width: 100%; height: 220px; font-family: monospace; font-size: 12px; background: #000; color: #0f0; border: 1px solid #333; box-sizing: border-box; }
  </style>
</head>
<body>
  <h1>Spike Tabata – validación</h1>

  <div id="status"></div>

  <button id="sound">1. Probar sonido</button>
  <button id="startShort" class="primary">2a. Prueba corta (~1 min)</button>
  <button id="startReal" class="primary">2b. Configuración real (~24 min)</button>
  <button id="pause">Pausar</button>
  <button id="finish" class="danger">Finalizar</button>

  <div id="phase">—</div>
  <div id="time">0:00</div>
  <div id="next"></div>
  <div id="total"></div>

  <h1>Registro</h1>
  <button id="copy">Copiar registro</button>
  <textarea id="log" readonly></textarea>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
